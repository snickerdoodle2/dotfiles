[mgr.cwd]
fg = "#a6e3a1"
bold = true

[mgr.find_keyword]
fg = "#f9e2af"
italic = true

[mgr.find_position]
fg = "#cdd6f4"
italic = true

[mgr.marker_copied]
fg = "#a6e3a1"
bg = "#a6e3a1"

[mgr.marker_cut]
fg = "#f38ba8"
bg = "#f38ba8"

[mgr.marker_selected]
fg = "#89b4fa"
bg = "#89b4fa"

[mgr.count_copied]
fg = "#11111b"
bg = "#a6e3a1"

[mgr.count_cut]
fg = "#11111b"
bg = "#f38ba8"

[mgr.count_selected]
fg = "#11111b"
bg = "#89b4fa"

[indicator.parent]
bg = "#313244"

[indicator.current]
bg = "#313244"

[indicator.preview]
bg = "#313244"

[indicator.padding]
open = "█"
close = "█"

[tabs.active]
fg = "#11111b"
bg = "#a6e3a1"
bold = true

[tabs.inactive]
bg = "reset"
italic = true

[tabs.sep_inner]
open = ""
close = ""

[tabs.sep_outer]
open = " "
close = " "

[mode.normal_main]
fg = "#11111b"
bg = "#f5e0dc"
bold = true

[mode.normal_alt]
fg = "#cdd6f4"
bg = "#181825"

[mode.select_main]
fg = "#11111b"
bg = "#89b4fa"
bold = true

[mode.select_alt]
fg = "#cdd6f4"
bg = "#181825"

[mode.unset_main]
fg = "#11111b"
bg = "#f38ba8"
bold = true

[mode.unset_alt]
fg = "#cdd6f4"
bg = "#181825"

[status.sep_left]
open = ""
close = ""

[status.sep_right]
open = ""
close = ""

[status.perm_type]
fg = "#cba6f7"
bold = true

[status.perm_read]
fg = "#a6e3a1"
bold = true

[status.perm_write]
fg = "#f9e2af"
bold = true

[status.perm_exec]
fg = "#f38ba8"
bold = true

[status.progress_normal]
bg = "#181825"
italic = true

[status.progress_error]
bg = "#f38ba8"
fg = "#11111b"
bold = true

[which]
separator = " "

[which.mask]
bg = "#11111b"

[which.cand]
fg = "#a6e3a1"
bold = true

# TODO: which.rest ??
[which.desc]
fg = "#a6adc8"
italic = true

# TODO: rest options

[filetype]
rules = [
  { url = "*", is = "orphan", fg = "#f38ba8" },
  { url = "*", fg = "#cdd6f4" },
  { url = "*/", fg = "#89b4fa" }
]

